<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rita</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400&family=Amiri:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg1:#1a0a1f;--bg2:#050207;--ink:#f6e7ee;--accent:#ff4f8b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg2);color:var(--ink);overflow:hidden}
body{background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2) 70%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#btn{position:fixed;left:50%;transform:translateX(-50%);bottom:18%;padding:12px 30px;border:1px solid #ffb38a;border-radius:999px;background:linear-gradient(#ff9a6a,#e8704a);color:#2a0d05;font:600 15px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.12em;cursor:pointer;transition:opacity .8s}
#btn:hover{filter:brightness(1.1)}
#end{position:fixed;left:0;right:0;text-align:center;opacity:0;transition:opacity 2s;pointer-events:none}
#end small{display:block;font:400 18px 'Cormorant Garamond',Georgia,serif;letter-spacing:.2em;opacity:.85}
#end b{display:block;font:400 clamp(44px,12vw,72px)/1.1 'Great Vibes',cursive;font-weight:400;background:linear-gradient(#fff,#f7b6d0);-webkit-background-clip:text;background-clip:text;color:transparent}
#again{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:none;border:0;color:var(--ink);opacity:0;font:14px 'Cormorant Garamond',serif;cursor:pointer;transition:opacity 2s}
#q{position:fixed;left:0;right:0;bottom:calc(4% + env(safe-area-inset-bottom,0px));text-align:center;opacity:0;pointer-events:none;transition:opacity 1.5s}
#q.on{opacity:1;pointer-events:auto}
#qt{margin:0 0 12px;font:400 clamp(28px,8vw,38px)/1.1 'Great Vibes',cursive;color:#ffd6e6}
#qb{display:flex;gap:16px;justify-content:center}
#qb button{padding:10px 28px;border-radius:999px;font:600 15px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.12em;cursor:pointer;border:1px solid #ffb38a}
#yes{transition:transform .3s;background:linear-gradient(#ff7ab0,#ff4f8b);color:#fff;border-color:#ffb0cc}
#no{background:rgba(255,255,255,.1);color:var(--ink);transition:left .25s,top .25s}
#no.run{position:fixed}
#again{z-index:5}
#ltr{position:fixed;inset:0;z-index:4;display:flex;overflow-y:auto;background:rgba(5,2,7,.86);opacity:0;pointer-events:none;transition:opacity 1.5s}
#ltr.on{opacity:1;pointer-events:auto}
#lt{margin:0 auto;width:100%;max-width:440px;box-sizing:border-box;padding:14vh 28px 160px;text-align:left}
#lt p{margin:0 0 1.1em;font:400 clamp(18px,4.8vw,22px)/1.55 'Cormorant Garamond',Georgia,serif;color:var(--ink);letter-spacing:.02em}
#lt p.h{font:400 clamp(34px,9vw,44px)/1.2 'Great Vibes',cursive;color:#ffd6e6}
#lock{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center;background:rgba(5,2,7,.78);transition:opacity 1.2s}
#lock.off{opacity:0;pointer-events:none}
#lock h2{margin:0;font:400 clamp(36px,10vw,50px)/1.1 'Great Vibes',cursive;color:#ffd6e6}
#lock p{margin:0;font:400 16px 'Cormorant Garamond',Georgia,serif;letter-spacing:.2em;opacity:.85}
#pw{width:min(260px,70vw);padding:11px 18px;border-radius:999px;border:1px solid #ffb38a;background:rgba(255,255,255,.08);color:var(--ink);font:400 18px 'Cormorant Garamond',Georgia,serif;text-align:center;letter-spacing:.12em;outline:none}
#pw:focus{border-color:#ff7ab0}
#msg{min-height:20px;font:400 16px 'Cormorant Garamond',Georgia,serif;color:#ff9aa8}
#ok{padding:11px 30px;border:1px solid #ffb38a;border-radius:999px;background:linear-gradient(#ff9a6a,#e8704a);color:#2a0d05;font:600 15px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.12em;cursor:pointer}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#lt p.ar{direction:rtl;text-align:center;font:400 clamp(24px,6.5vw,30px)/1.6 'Amiri','Noto Naskh Arabic',serif}
#rp{position:fixed;right:16px;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:5;width:min(270px,calc(100vw - 32px));text-align:right;opacity:0;pointer-events:none;transition:opacity 1.5s}
#rp.on{opacity:1;pointer-events:auto}
#rp label{display:block;margin:0 0 6px;font:400 14px/1.35 'Cormorant Garamond',Georgia,serif;letter-spacing:.04em;opacity:.85}
#rw{display:flex;gap:6px}
#rt{flex:1;min-width:0;padding:9px 14px;border-radius:999px;border:1px solid #ffb38a;background:rgba(255,255,255,.08);color:var(--ink);font:400 16px 'Cormorant Garamond',Georgia,serif;outline:none}
#rs{width:38px;border-radius:50%;border:1px solid #ffb38a;background:linear-gradient(#ff9a6a,#e8704a);color:#2a0d05;font:600 16px/1 Georgia,serif;cursor:pointer}
#fin{position:fixed;left:0;right:0;bottom:calc(9% + env(safe-area-inset-bottom,0px));z-index:3;text-align:center;font:400 clamp(30px,8vw,40px)/1.1 'Great Vibes',cursive;color:#ffd6e6;opacity:0;pointer-events:none;transition:opacity 2s}
#fin.on{opacity:1}
#sky{margin:2.4em 0 0;text-align:center;opacity:0;transition:opacity 2s}
#sky.on{opacity:1}
#sky .sk{display:flex;align-items:center;justify-content:center;gap:22px}
#sky small{display:block;font:400 12px 'Cormorant Garamond',Georgia,serif;letter-spacing:.25em;opacity:.7}
#sky b{display:block;font:400 26px 'Cormorant Garamond',Georgia,serif;letter-spacing:.08em;font-variant-numeric:tabular-nums}
#sky i{display:block;margin-top:10px;font:400 16px 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;opacity:.8}
#moon{width:56px;height:56px}
#sky{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:5;margin:0;text-align:right;pointer-events:none}
#sky small{font-size:10px;letter-spacing:.2em}
#sky b{font:400 19px 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#sky i{margin-top:6px;font-size:13px;line-height:1.25}
#sky .sc{margin-top:6px}
#moon{width:40px;height:40px;margin-left:auto;display:block}

<script>
var NAME="Rita";
document.getElementById('nm').textContent=NAME;
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W,H,D,N,P=[],stars=[],petals=[],stage=0,t0=0,mouse={x:-999,y:-999},T=[null,null,null,null,null,null,null];
function rnd(a,b){return a+Math.random()*(b-a)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,x=a[i];a[i]=a[j];a[j]=x}return a}
function textPts(txt,font,cx,cy,col,step){
  var o=document.createElement('canvas');o.width=W;o.height=H;var g=o.getContext('2d');
  g.font=font;g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';g.fillText(txt,cx,cy);
  var d=g.getImageData(0,0,W,H).data,r=[];
  for(var y=0;y<H;y+=step)for(var x=0;x<W;x+=step)if(d[(y*W+x)*4+3]>128)r.push({x:x+rnd(-1,1),y:y+rnd(-1,1),c:col});
  return r;
}
function build(){
  var S=Math.min(W,H),cx=W/2;
  // 0: envelope

  line(L,Tp,R,Tp,gold);line(R,Tp,R,B,gold);line(R,B,L,B,gold);line(L,B,L,Tp,gold);

  line(L,B,cx-ew*0.12,cy+eh*0.02,'#e9b98a');line(R,B,cx+ew*0.12,cy+eh*0.02,'#e9b98a');

    for(var k=0;k<3;k++)e.push({x:cx+hx*0.9+rnd(-1,1),y:cy-eh*0.08+hy*0.9+rnd(-1,1),c:'#ff7ab0'})}
  e=e.concat(textPts('FOR YOU','700 '+Math.round(ew*0.11)+"px 'Courier New',monospace",cx,cy+eh*0.28,'#fff',2));
  T[0]=shuffle(e);
